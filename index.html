<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Google News & Cricket RSS/JSON Feed Generator</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 30px auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { color: var(--primary); margin-top: 0; font-size: 22px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .preset-buttons { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .preset-btn { background: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: #475569; }
        .preset-btn:hover { background: #cbd5e1; }
        button.main-btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button.main-btn:hover { background: #1d4ed8; }
        textarea { width: 100%; height: 220px; font-family: monospace; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 15px; font-size: 13px; box-sizing: border-box; background: #f1f5f9; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .actions button { background: #0ea5e9; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; }
        .actions button:hover { background: #0284c7; }
        .note { font-size: 12px; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Google News & Cricket Realtime Feed Generator</h1>
        
        <div class="form-group">
            <label>Quick Presets (Topics):</label>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setPreset('Cricket Match Live News', 'cricket')">🏏 Cricket</button>
                <button class="preset-btn" onclick="setPreset('Top Stories India', 'topstories')">🔥 Top Stories</button>
                <button class="preset-btn" onclick="setPreset('Artificial Intelligence', 'keyword')">🤖 AI Tech</button>
                <button class="preset-btn" onclick="setPreset('Stock Market Business', 'keyword')">📈 Business</button>
            </div>
        </div>

        <div class="form-group">
            <label for="feedType">Feed Category / Type:</label>
            <select id="feedType" onchange="toggleInput()">
                <option value="keyword">Custom Keyword Search (Google News)</option>
                <option value="topstories">Google News Top Stories (Realtime)</option>
                <option value="cricket">Cricket Live News & Updates</option>
            </select>
        </div>

        <div class="form-group" id="keywordGroup">
            <label for="keywordInput">Enter Keyword:</label>
            <input type="text" id="keywordInput" placeholder="e.g. Technology, Bitcoin, Virat Kohli, elections">
        </div>

        <button class="main-btn" onclick="generateFeed()">Generate Live RSS/XML Feed</button>

        <div id="outputSection" style="display:none;">
            <label style="margin-top:20px;">Generated RSS XML Feed (Copy & Use anywhere):</label>
            <textarea id="rssOutput" readonly></textarea>
            <div class="actions">
                <button onclick="copyRSS()">Copy RSS XML</button>
                <button onclick="downloadRSS()">Download .xml File</button>
            </div>
            <div class="note" id="feedStatus" style="margin-top: 10px; color: green; font-weight: 600;"></div>
        </div>
    </div>

    <script>
        function setPreset(text, type) {
            document.getElementById('feedType').value = type;
            if(type === 'keyword') {
                document.getElementById('keywordInput').value = text;
            }
            toggleInput();
        }

        function toggleInput() {
            const type = document.getElementById('feedType').value;
            document.getElementById('keywordGroup').style.display = (type === 'keyword') ? 'block' : 'none';
        }

        async function generateFeed() {
            const type = document.getElementById('feedType').value;
            let googleRssUrl = '';
            let feedTitle = 'Google Realtime News Feed';

            if (type === 'keyword') {
                const kw = document.getElementById('keywordInput').value.trim();
                if (!kw) { alert('Kripya keyword dalein!'); return; }
                googleRssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(kw)}&hl=hi&gl=IN&ceid=IN:hi`;
                feedTitle = `Google News: ${kw}`;
            } else if (type === 'topstories') {
                googleRssUrl = `https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi`;
                feedTitle = `Google News - Top Stories (India)`;
            } else if (type === 'cricket') {
                googleRssUrl = `https://news.google.com/rss/search?q=Cricket+live+match+score+news&hl=hi&gl=IN&ceid=IN:hi`;
                feedTitle = `Live Cricket News & Updates`;
            }

            alert('Realtime data fetch ho raha hai...');

            try {
                // Using CORS proxy to fetch Google News official XML feed safely in browser
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(googleRssUrl)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (!data.contents) throw new Error('Data fetch nahi ho paya.');

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, 'text/xml');
                const items = xmlDoc.querySelectorAll('item');

                let itemsXML = '';
                items.forEach((item, index) => {
                    if (index > 20) return; // Top 20 items

                    const title = item.querySelector('title') ? item.querySelector('title').textContent : 'No Title';
                    const link = item.querySelector('link') ? item.querySelector('link').textContent : '';
                    const pubDate = item.querySelector('pubDate') ? item.querySelector('pubDate').textContent : '';
                    const description = item.querySelector('description') ? item.querySelector('description').textContent : '';

                    // Google News me images description ke andar HTML format me hoti hain, use extract karna ya rakhna
                    itemsXML += `
        <item>
            <title><![CDATA[${title}]]></title>
            <link>${link}</link>
            <guid>${link}</guid>
            <pubDate>${pubDate}</pubDate>
            <description><![CDATA[${description}]]></description>
        </item>`;
                });

                const finalRss = `<?xml version="1.0" encoding="UTF-8" ?>
<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">
    <channel>
        <title><![CDATA[${feedTitle}]]></title>
        <link>https://news.google.com</link>
        <description>Realtime RSS feed generated dynamically for keywords, top stories, and cricket.</description>
        <language>hi-IN</language>
        ${itemsXML}
    </channel>
</rss>`;

                document.getElementById('rssOutput').value = finalRss;
                document.getElementById('outputSection').style.display = 'block';
                document.getElementById('feedStatus').innerText = 'Success! Realtime feed generate ho chuki hai.';

            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
